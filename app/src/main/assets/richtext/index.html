<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Question HTML is cleaned by the server (RichTextSanitizer); this policy is the second guard:
     only this page's own scripts run, so handlers or scripts inside the content never execute. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: http: https:; font-src 'self'">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="rich.css">
<script src="katex/katex.min.js"></script>
<script src="renderer.js"></script>
</head>
<body>
<div id="content" class="rich-content"></div>
</body>
</html>
